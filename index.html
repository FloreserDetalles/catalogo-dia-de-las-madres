<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Floreser Detalles</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #fff8f5;
      text-align: center;
    }

    header {
      background: #ffe4e1;
      padding: 20px;
    }

    h2 {
      margin-top: 40px;
    }

    .contenedor {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .producto {
      background: white;
      margin: 15px;
      padding: 15px;
      border-radius: 10px;
      width: 250px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      background: #25D366;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Floreser Detalles 💐</h1>
  <p>Haz tu pedido por WhatsApp</p>
</header>

<!-- RAMOS -->
<h2>💐 Ramos</h2>
<div class="contenedor">
  <div class="producto">
    <img src="./35.jpg">
    <h3>Ramo de girasoles</h3>
    <p>Desde $35.000</p>
    <a href="https://wa.me/573247029744?text=Hola%20quiero%20un%20ramo%20de%20girasoles">
      <button>Comprar</button>
    </a>
  </div>

  <div class="producto">
    <img src="./36.jpg">
    <h3>Ramo de rosas</h3>
    <p>Desde $40.000</p>
    <a href="https://wa.me/573247029744?text=Hola%20quiero%20un%20ramo%20de%20rosas">
      <button>Comprar</button>
    </a>
  </div>
</div>

<!-- MUGS -->
<h2>☕ Mugs personalizados</h2>
<div class="contenedor">
  <div class="producto">
    <img src="./19.jpg">
    <h3>Mug personalizado</h3>
    <p>Desde $12.000</p>
    <a href="https://wa.me/573247029744?text=Hola%20quiero%20un%20mug">
      <button>Comprar</button>
    </a>
  </div>
</div>

<!-- ANCHETAS -->
<h2>🎁 Anchetas</h2>
<div class="contenedor">
  <div class="producto">
    <img src="./20.jpg">
    <h3>Ancheta personalizada</h3>
    <p>Desde $70.000</p>
    <a href="https://wa.me/573247029744?text=Hola%20quiero%20una%20ancheta">
      <button>Comprar</button>
    </a>
  </div>
</div>

<!-- BOTÓN WHATSAPP -->
<a href="https://wa.me/573247029744" target="_blank"
style="position:fixed;bottom:20px;right:20px;background:#25D366;color:white;padding:15px;border-radius:50%;text-decoration:none;">
💬
</a>

</body>
</html>
